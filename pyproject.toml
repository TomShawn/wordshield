[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wordshield-offline"
version = "0.2.1"
description = "完全离线的 Word 黄色高亮脱敏与回填工具"
requires-python = ">=3.11"
dependencies = ["python-docx>=1.1,<2", "lxml>=5,<7", "cryptography>=43,<51"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6.11,<7"]

[project.scripts]
wordshield = "wordshield.gui:main"

[tool.setuptools.packages.find]
include = ["wordshield*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
